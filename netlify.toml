# Konfiguration für Netlify. Ersetzt die .htaccess — HTTPS und Komprimierung
# erledigt Netlify von sich aus, hier stehen nur Caching und Sicherheits-Header.

[build]
  publish = "."

# Schriften und Bilder ändern sich nie — ein Jahr zwischenspeichern
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/bilder/*"
  [headers.values]
    Cache-Control = "public, max-age=15552000"

# HTML immer frisch holen, sonst sehen Besucher nach einer Änderung die alte Seite
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

# Einseitige Website: unbekannte Adressen zeigen die Startseite
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 404
